name: Release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: argon-${{ matrix.os }}
          path: |
            target/release/*argon*
            include/argon.h

  npm-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: bindings/ts
        run: npm ci && npm run build && npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: argon-npm
          path: bindings/ts/*.tgz

  publish-npm:
    needs: npm-pack
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - working-directory: bindings/ts
        if: env.NPM_TOKEN != ''
        run: npm ci && npm run build && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  publish-crates:
    needs: package
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Verify package readiness
        run: cargo check --workspace --all-features
      - name: Publish crates to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          for crate in argon-kernel argon-runtime argon-medium argon-ffi argon-wasm argon-io argon-backend argon-cli; do
            cargo publish -p $crate --token ${{ env.CARGO_REGISTRY_TOKEN }}
            sleep 10
          done
