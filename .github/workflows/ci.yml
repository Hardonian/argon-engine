name: Argon Engine CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-platform-gate:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting
        run: cargo fmt --all -- --check
        if: runner.os == 'Linux'

      - name: Run Strict Clippy Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: runner.os == 'Linux'

      - name: Execute Workspace Unit & Integration Tests
        run: cargo test --workspace --all-features -- --nocapture

      - name: Verify WASM Target Compilation
        run: cargo build -p argon-wasm --target wasm32-unknown-unknown --release
        if: runner.os == 'Linux'

      - name: C ABI smoke test
        if: runner.os == 'Linux'
        run: |
          cargo build -p argon-ffi
          cc -Iinclude examples/c_ffi_smoke.c -Ltarget/debug -largon_ffi -o target/c_ffi_smoke
          LD_LIBRARY_PATH=target/debug target/c_ffi_smoke

  typescript-harness-gate:
    name: TypeScript Strict Harness & Triton Fallback Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & Verify TypeScript Bindings
        working-directory: bindings/ts
        run: |
          npm install
          npm run typecheck
          npm run build
          npm test

      - name: Verify Triton Kernel CPU Simulation Fallback
        run: |
          python3 -m pip install --upgrade pip numpy
          python3 kernels/triton/persistent_sram_ff.py
