[workspace]
resolver = "2"
members = [
    "crates/argon-kernel",
    "crates/argon-runtime",
    "crates/argon-ffi",
    "crates/argon-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Scott Hardie <scott@hardonia.store>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hardonian/argon-engine"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
